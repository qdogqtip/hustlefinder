<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HustleFinder</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 30px 20px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    margin-top: 25px;
}

.tagline {
    text-align: center;
    color: #666;
    margin-bottom: 35px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

.options {
    display: grid;
    gap: 12px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.selected {
    background: #087f5b;
}

.primary {
    margin-top: 20px;
    background: #111;
    font-weight: bold;
}

#results {
    display: none;
}

.hustle {
    border-top: 1px solid #ddd;
    padding: 18px 0;
}

.hustle:first-child {
    border-top: none;
}

.hustle h3 {
    margin-bottom: 8px;
}

.tag {
    display: inline-block;
    padding: 5px 9px;
    background: #eee;
    border-radius: 8px;
    font-size: 13px;
    margin-right: 5px;
    margin-bottom: 8px;
}

.start-button {
    background: #087f5b;
    margin-top: 10px;
}

.back-button {
    background: #555;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">💰 HustleFinder</div>

<div class="tagline">
Find a side hustle that fits your life.
</div>


<div id="questions">


<div class="card">
<h2>How much can you start with?</h2>

<div class="options">

<button onclick="selectOption(this, 'money', '0')">
$0
</button>

<button onclick="selectOption(this, 'money', '25')">
$25
</button>

<button onclick="selectOption(this, 'money', '50')">
$50
</button>

<button onclick="selectOption(this, 'money', '100')">
$100+
</button>

</div>
</div>


<div class="card">
<h2>How much time do you have?</h2>

<div class="options">

<button onclick="selectOption(this, 'time', 'low')">
1–5 hours/week
</button>

<button onclick="selectOption(this, 'time', 'medium')">
5–10 hours/week
</button>

<button onclick="selectOption(this, 'time', 'high')">
10+ hours/week
</button>

</div>
</div>


<div class="card">
<h2>Do you have a vehicle?</h2>

<div class="options">

<button onclick="selectOption(this, 'vehicle', 'yes')">
Yes
</button>

<button onclick="selectOption(this, 'vehicle', 'no')">
No
</button>

</div>
</div>


<button class="primary" onclick="findHustles()">
FIND MY HUSTLES 🚀
</button>

</div>


<div id="results">

<div class="card">

<h2>💰 Your Hustle Matches</h2>

<p>
Based on your answers, here are some opportunities to consider:
</p>

<div id="hustleList"></div>

<button class="back-button" onclick="startOver()">
START OVER
</button>

</div>

</div>

</div>


<script>

let answers = {};


function selectOption(button, category, value) {

answers[category] = value;

let buttons = button.parentElement.querySelectorAll("button");

buttons.forEach(function(btn) {
    btn.classList.remove("selected");
});

button.classList.add("selected");

}


function findHustles() {

if (
answers.money === undefined ||
answers.time === undefined ||
answers.vehicle === undefined
) {

alert("Please answer all three questions first.");

return;

}


let hustles = [];


// $0 + limited time
if (
answers.money === "0" &&
answers.time === "low"
) {

if (answers.vehicle === "yes") {

hustles.push({
name: "Local Errand Service",
cost: "$0–$25",
difficulty: "Easy",
description:
"Help local people with errands, pickups, deliveries and small tasks."
});

hustles.push({
name: "Local Delivery Service",
cost: "$0–$25",
difficulty: "Easy",
description:
"Offer local pickup and delivery services for people and small businesses."
});

}

hustles.push({
name: "Digital Services",
cost: "$0",
difficulty: "Easy",
description:
"Offer simple online services such as writing, research, data entry or social media help."
});

hustles.push({
name: "Resume Assistance",
cost: "$0",
difficulty: "Easy",
description:
"Help job seekers improve resumes, cover letters and applications."
});

}


// More money + more time
else if (
answers.money !== "0" &&
(answers.time === "medium" || answers.time === "high")
) {

if (answers.vehicle === "yes") {

hustles.push({
name: "Mobile Car Cleaning",
cost: "$25–$100",
difficulty: "Easy",
description:
"Clean cars at customers' homes or workplaces using basic supplies."
});

hustles.push({
name: "Local Delivery Service",
cost: "$0–$25",
difficulty: "Easy",
description:
"Offer local pickup and delivery services for people and small businesses."
});

hustles.push({
name: "Local Errand Service",
cost: "$0–$25",
difficulty: "Easy",
description:
"Help local people with errands, pickups, deliveries and small tasks."
});

}

hustles.push({
name: "Digital Services",
cost: "$0",
difficulty: "Easy",
description:
"Offer simple online services such as writing, research, data entry or social media help."
});

hustles.push({
name: "Resume Assistance",
cost: "$0",
difficulty: "Easy",
description:
"Help job seekers improve resumes, cover letters and applications."
});

}


// No vehicle + limited time
else if (
answers.vehicle === "no" &&
answers.time === "low"
) {

hustles.push({
name: "Digital Services",
cost: "$0",
difficulty: "Easy",
description:
"Offer simple online services such as writing, research, data entry or social media help."
});

hustles.push({
name: "Resume Assistance",
cost: "$0",
difficulty: "Easy",
description:
"Help job seekers improve resumes, cover letters and applications."
});

hustles.push({
name: "Marketplace Flipping",
cost: "$0–$50",
difficulty: "Easy",
description:
"Find free or inexpensive items locally and resell them for a profit."
});

}


// Other combinations
else {

hustles.push({
name: "Digital Services",
cost: "$0",
difficulty: "Easy",
description:
"Offer simple online services such as writing, research, data entry or social media help."
});

hustles.push({
name: "Resume Assistance",
cost: "$0",
difficulty: "Easy",
description:
"Help job seekers improve resumes, cover letters and applications."
});

hustles.push({
name: "Marketplace Flipping",
cost: "$0–$50",
difficulty: "Easy",
description:
"Find free or inexpensive items locally and resell them for a profit."
});

if (answers.vehicle === "yes") {

hustles.push({
name: "Local Errand Service",
cost: "$0–$25",
difficulty: "Easy",
description:
"Help local people with errands, pickups, deliveries and small tasks."
});

}

}


// Display hustles

let list = document.getElementById("hustleList");

list.innerHTML = "";


hustles.forEach(function(hustle) {

let div = document.createElement("div");

div.className = "hustle";

div.innerHTML =
"<h3>" + hustle.name + "</h3>" +

"<span class='tag'>Start: " +
hustle.cost +
"</span>" +

"<span class='tag'>" +
hustle.difficulty +
"</span>" +

"<p>" +
hustle.description +
"</p>" +

"<button class='start-button' onclick=\"showPlan('" +
hustle.name +
"')\">" +

"HOW DO I START?" +

"</button>";

list.appendChild(div);

});


document.getElementById("questions").style.display = "none";

document.getElementById("results").style.display = "block";

window.scrollTo(0, 0);

}

let title = "";

"<li>Post locally.</li>" +
"<li>Complete your first delivery and request a review.</li>" +
"</ol>";

}


else if (name === "Digital Services") {

title = "💻 Digital Services";

content =
"<h2>" + title + "</h2>" +

"<p><strong>💰 Starting cost:</strong> $0</p>" +

"<p><strong>💵 What you can charge:</strong> $10–$50+ per small project</p>" +

"<h3>🧰 What you need</h3>" +
"<p>A phone or computer and internet access.</p>" +

"<h3>💼 Services you can offer</h3>" +

"<h3>🚀 Your first 5 steps</h3>" +

"<li>Complete your first project and request a review.</li>" +
"</ol>";

}


else if (name === "Resume Assistance") {

title = "📄 Resume Assistance";

content =

document.getElementById("questions").style.display = "none";

document.getElementById("results").style.display = "none";

let results = document.getElementById("results");

results.innerHTML =
"<div class='card'>" +
content +
"<button class='back-button' onclick='backToResults()'>" +
"← BACK TO MY HUSTLES" +
"</button>" +
"</div>";

results.style.display = "block";

window.scrollTo(0, 0);

}


function backToResults() {

document.getElementById("results").innerHTML =
"<div class='card'>" +

"<h2>💰 Your Hustle Matches</h2>" +

"<p>" +
"Based on your answers, here are some opportunities to consider:" +
"</p>" +

"<div id='hustleList'></div>" +

"<button class='back-button' onclick='startOver()'>" +
"START OVER" +
"</button>" +

"</div>";

document.getElementById("questions").style.display = "none";

document.getElementById("results").style.display = "block";

findHustles();

}


function startOver() {

answers = {};

document.getElementById("questions").style.display = "block";

document.getElementById("results").style.display = "none";


let selectedButtons = document.querySelectorAll(".selected");

selectedButtons.forEach(function(button) {
button.classList.remove("selected");
});


window.scrollTo(0, 0);

}

</script>

</body>
    </html>
