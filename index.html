<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HustleFinder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px 20px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-top: 25px;
        }

        .tagline {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .selected {
            background: #444;
        }

        .primary {
            margin-top: 20px;
            background: #111;
            font-weight: bold;
        }

        #results {
            display: none;
        }

        .hustle {
            border-top: 1px solid #ddd;
            padding: 18px 0;
        }

        .hustle:first-child {
            border-top: none;
        }

        .hustle h3 {
            margin-bottom: 8px;
        }

        .tag {
            display: inline-block;
            padding: 5px 9px;
            background: #eee;
            border-radius: 8px;
            font-size: 13px;
            margin-right: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">💰 HustleFinder</div>

    <div class="tagline">
        Find a side hustle that fits your life.
    </div>

    <div id="questions">

        <div class="card">
            <h2>How much can you start with?</h2>

            <div class="options">
                <button onclick="selectOption(this, 'money', '0')">
                    $0
                </button>

                <button onclick="selectOption(this, 'money', '25')">
                    $25
                </button>

                <button onclick="selectOption(this, 'money', '50')">
                    $50
                </button>

                <button onclick="selectOption(this, 'money', '100')">
                    $100+
                </button>
            </div>
        </div>

        <div class="card">
            <h2>How much time do you have?</h2>

            <div class="options">

                <button onclick="selectOption(this, 'time', 'low')">
                    1–5 hours/week
                </button>

                <button onclick="selectOption(this, 'time', 'medium')">
                    5–10 hours/week
                </button>

                <button onclick="selectOption(this, 'time', 'high')">
                    10+ hours/week
                </button>

            </div>
        </div>

        <div class="card">
            <h2>Do you have a vehicle?</h2>

            <div class="options">

                <button onclick="selectOption(this, 'vehicle', 'yes')">
                    Yes
                </button>

                <button onclick="selectOption(this, 'vehicle', 'no')">
                    No
                </button>

            </div>
        </div>

        <button class="primary" onclick="findHustles()">
            FIND MY HUSTLES 🚀
        </button>

    </div>

    <div id="results">

        <div class="card">

            <h2>Your Hustle Matches</h2>

            <p>
                Based on your answers, here are some opportunities to consider:
            </p>

            <div id="hustleList"></div>

            <button onclick="location.reload()">
                Start Over
            </button>

        </div>

    </div>

</div>

<script>

let answers = {};

function selectOption(button, category, value) {

    answers[category] = value;

    let buttons = button.parentElement.querySelectorAll("button");

    buttons.forEach(function(btn) {
        btn.classList.remove("selected");
    });

    button.classList.add("selected");
}
